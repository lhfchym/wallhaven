name: WallhavenMac
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "14.0"
packages: {}
targets:
  WallhavenCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/WallhavenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.wallhavencore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  WallhavenMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/WallhavenMac
      - Resources/Assets.xcassets
    dependencies:
      - target: WallhavenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.wallhavenmac
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: "6.0"
