app-id: dev.local.WallhavenLinux
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: WallhavenLinux

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.kde.kwalletd6
  - --filesystem=xdg-pictures

modules:
  - name: wallhaven-linux
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
